<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloxd TierZone</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  background:#080808;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}
.logo{
  font-size:44px;
  font-weight:900;
}
.logo span{color:#e63946}
.loader{
  width:220px;
  height:4px;
  background:#222;
  margin-top:25px;
  overflow:hidden;
}
.loader span{
  display:block;
  height:100%;
  width:45%;
  background:#e63946;
  animation:load 1.5s infinite;
}
@keyframes load{
  from{transform:translateX(-100%)}
  to{transform:translateX(500%)}
}

/* HOME */
#home{display:none}
nav{
  height:70px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
}
.brand{
  font-size:23px;
  font-weight:900;
}
.brand span{color:#e63946}
.nav-text{
  color:#888;
  font-size:13px;
}

.hero{
  min-height:calc(100vh - 70px);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}
.content{max-width:800px}
.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #333;
  border-radius:20px;
  color:#999;
  font-size:12px;
  margin-bottom:22px;
}
h1{
  font-size:clamp(48px,8vw,85px);
  line-height:.95;
  font-weight:900;
}
h1 span{color:#e63946}
.desc{
  max-width:600px;
  margin:25px auto;
  color:#999;
  line-height:1.6;
}
.buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
button{
  padding:14px 24px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}
.primary{
  background:#e63946;
  color:white;
  border:1px solid #e63946;
}
.secondary{
  background:#151515;
  color:white;
  border:1px solid #333;
}
footer{
  position:fixed;
  bottom:18px;
  width:100%;
  text-align:center;
  color:#555;
  font-size:12px;
}
footer span{color:#888}

@media(max-width:600px){
  .nav-text{display:none}
  nav{padding:0 20px}
}
</style>
</head>

<body>

<div id="loading">
  <div class="logo">TIER<span>ZONE</span></div>
  <div class="loader"><span></span></div>
</div>

<div id="home">

<nav>
  <div class="brand">TIER<span>ZONE</span></div>
  <div class="nav-text">BLOXD.IO COMPETITIVE RANKINGS</div>
</nav>

<section class="hero">
  <div class="content">

    <div class="badge">BLOXD.IO COMPETITIVE TIER LIST</div>

    <h1>
      Welcome to<br>
      <span>TierZone</span>
    </h1>

    <p class="desc">
      The competitive ranking hub for Bloxd.io players.
      Check rankings, tier tests, results and leaderboards.
    </p>

    <div class="buttons">
      <button class="primary">View Leaderboard</button>
      <button class="secondary">Join Discord Server</button>
    </div>

  </div>
</section>

<footer>
  Founder: <span>@bloxd malice</span>
</footer>

</div>

<script>
setTimeout(function(){
  document.getElementById("loading").style.display="none";
  document.getElementById("home").style.display="block";
},1800);
</script>

</body>
</html>
